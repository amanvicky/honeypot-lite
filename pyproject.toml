[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honeypot-lite"
version = "0.1.0"
description = "A real-time trap for scanners and brute-forcers: fake SSH/telnet/HTTP services, live feed, JSONL forensics"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Aman Elugam" }]

[project.scripts]
honeypot-lite = "honeypot:main"
